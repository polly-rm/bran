{% for message in messages %}
  <div aria-live="polite" aria-atomic="true" class="position-relative bd-example-toasts">
    <div class="toast-container position-absolute p-3" style="top: 20px; right: 0">  
      <div class="toast" role="alert" aria-live="assertive" aria-atomic="true" id="toast-{{ forloop.counter }}" data-bs-delay="{% if delay_toast %}10000{% else %}5000{% endif %}">
        <div class="toast-header">
          <strong class="me-auto">Notification</strong>
          <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body">
          {{ message }}
        </div>
      </div>
    </div>
  </div>
{% endfor %}
