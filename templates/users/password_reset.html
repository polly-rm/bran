<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<h1 class="h3 mb-3 fw-normal mt-5">Reset password</h1>
<p class="text-muted">Enter your email address below and we will send you instructions on resetting your password.</p>

<form class="text-center" action="{% url 'users:password-reset' %}" method="post">
    {% csrf_token %}

    <div class="form-floating">
        {{ form.email }}
        <label for="{{ form.email.auto_id }}">{{ form.email.label }}</label>
    </div>

    {% for error in form.email.errors %}
        <p class="text-danger mt-4">{{ error }}</p>
    {% endfor %}

    <button class="w-100 mt-4 button-main-purple" type="submit">Send</button>

    <p class="mt-5 text-muted">&copy; {% now 'Y' %} Bran logisitcs</p>
</form>

</body>
</html>
